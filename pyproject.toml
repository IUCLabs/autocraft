[project]
name = "craft-automation"
version = "0.1.0"
description = "Backlog mirror, triage pipeline state and dashboard for the storytold craft apps"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
craft-auto = "craft_auto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craft_auto"]
