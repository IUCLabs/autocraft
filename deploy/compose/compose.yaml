# AutoCraft on one host with Docker Compose: dashboard, runner and a periodic container (sync and backup)
# that share the data and config volumes. docs/operations.md, "Running in a container", explains each choice;
# docs/migration.md, "VPS with Docker Compose", moves an existing install onto it.
#
# Setup: copy container.env.example to container.env (mode 0600) and fill it in, set AUTOCRAFT_IMAGE if the
# image is not the local `autocraft`, then `docker compose up -d`. Run exactly one copy of this stack per database.
name: autocraft

x-common: &common
  image: ${AUTOCRAFT_IMAGE:-autocraft:latest}
  env_file: container.env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }
  volumes:
    - data:/data
    - config:/config

services:
  dashboard:
    <<: *common
    command: ["dashboard"]
    # The reverse proxy on this host terminates TLS and forwards to this port. Nothing else may reach it.
    ports:
      - "127.0.0.1:3005:3005"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3005/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  runner:
    <<: *common
    command: ["runner"]
    # The worker API (8981) is not published. A build worker on another machine reaches it over a private
    # network or through a TLS proxy restricted to the worker's address (docs/migration.md, "VPS with Docker
    # Compose"). To bind it, uncomment one line and replace the address. Never bind it to 0.0.0.0, and never
    # route it through the dashboard's proxy site.
    expose:
      - "8981"
    #ports:
    #  - "10.8.0.1:8981:8981"   # a private-network (VPN) address of this host
    #  - "127.0.0.1:8981:8981"  # for a TLS proxy on this host
    # Above AUTOCRAFT_STOP_TIMEOUT (25 s): the runner stops its jobs before Docker kills it.
    stop_grace_period: 30s
    # bubblewrap (the sandbox of tool-using Claude calls) needs both settings; see operations.md, "Sandbox (bubblewrap)".
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8981/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The work of the systemd sync timer (every minute after the previous run ends) and backup timer (daily, keeping 7),
  # as one-shot commands of the same image. Same loop as the `periodic` container of deploy/k8s/autocraft.yaml.
  # `$$` is Compose's escape for a literal `$`.
  periodic:
    <<: *common
    entrypoint:
      - /usr/bin/tini
      - --
      - /bin/bash
      - -c
      - |
        trap 'exit 0' TERM INT
        last_backup=$$(date +%s)
        while true; do
          /app/deploy/entrypoint.sh sync || echo "sync exited $$?" >&2
          if [ $$(( $$(date +%s) - last_backup )) -ge 86400 ]; then
            /app/deploy/entrypoint.sh backup daily 7 || echo "backup exited $$?" >&2
            last_backup=$$(date +%s)
          fi
          sleep 60 & wait $$!
        done
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  data:
    name: autocraft-data
  config:
    name: autocraft-config
