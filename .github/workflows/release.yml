name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    # GitHub-hosted: the iuclabs runners have no docker
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/iuclabs/autocraft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          docker build -f deploy/container/Dockerfile
          --build-arg "SOURCE_COMMIT=${GITHUB_SHA}"
          --label org.opencontainers.image.source=https://github.com/IUCLabs/autocraft
          -t "${IMAGE}:${GITHUB_REF_NAME}" .
      - run: docker push "${IMAGE}:${GITHUB_REF_NAME}"
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
